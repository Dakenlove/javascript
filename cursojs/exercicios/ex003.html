<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Tratamento de dados</title>

    <style>
        body {
            background-color: beige;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>

</head>
<body>
    <h1>Continuando meu aprendizado sobre tratamento de dados com JS.</h1>

    <script>
        let n1 = Number.parseInt(window.prompt('Digite um número:'))  // podendo usar somente o Number para os dois
        let n2 = Number.parseInt(window.prompt('Digite outro número:'))
        let s = n1 + n2
        window.alert('A soma dos valores é ' + s)
        document.write('A soma dos valores é ' + s)
    </script>
</body>
</html>
