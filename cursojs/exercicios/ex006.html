<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando números</title>

    <style>
        body {
            font-family: arial, sans-serif;
            font-size: 20px;
        }
        input {
            width: 150px;
            height: 20px;
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>

</head>
<body>
    <h1>Somando números</h1> 
    <p>Digite dois números para somar:</p>
     <input type="number" id="num1" placeholder="Primeiro número"> + <!--caixa de texto para o primeiro número--> 
     <input type="number" id="num2" placeholder="Segundo número">   
     <button onclick="soma()">Somar</button>   <!-- botão que chama a função soma quando clicar -->
     <br>
     resultado: <span id="resultado"></span>   <!-- local onde o resultado da soma será exibido -->

     <script> 
        function soma() {
            var  num1 = document.getElementById("num1").value;  // pega o valor do primeiro número digitado
            var  num2 = document.getElementById("num2").value;  // pega o valor do segundo número digitado
            var resultado = document.getElementById("resultado"); // pega o elemento onde o resultado será exibido
            resultado = parseFloat(num1) + parseFloat(num2);  // realiza a soma dos dois números convertidos para float
            document.getElementById("resultado").innerHTML = `A soma entre ${num1} e ${num2} é  <strong>${resultado}</strong>`; // exibe o resultado da soma no elemento com id "resultado"
        }
        </script>
</body>
</html>
